# Profile for integration tests (AbstractIntegrationTest). The datasource, Redis and every credential are
# supplied there from the Testcontainers containers and dummy values.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Same as production: Flyway builds the schema, Hibernate only checks the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
# The Secure refresh cookie is never sent over the http:// MockMvc/test client.
app.cookie.secure=false
# No background jobs firing in the middle of a test.
app.scheduling.enabled=false
