<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif;">
<div style="background-color: #f5f5f5; padding: 20px;">
    <h2>Your gift card balance</h2>
    <p>Your Verdant Salon account was deleted, so the remaining gift card balance of
        <strong th:text="${amountText}"></strong> has been reissued as a new gift card.</p>
    <p>Your new gift card code:</p>
    <h3 th:text="${code}" style="color: #007bff; letter-spacing: 2px;"></h3>
    <p>You can redeem it from any Verdant Salon account.</p>
    <p style="color: #888; font-size: 12px;">Keep this code private - anyone who has it can redeem the card.</p>
</div>
</body>
</html>
