<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0;">
<div style="background-color: #f5f5f5; padding: 20px;">
    <div style="max-width: 560px; margin: 0 auto; background: #ffffff; padding: 28px; border-radius: 8px;">
        <h2 style="margin-top: 0;">Welcome to <span th:text="${brandName}"></span></h2>
        <p style="line-height: 1.6;">
            Thank you for subscribing. You're on the list &mdash; expect the occasional note about new rituals,
            collections and atelier news.
        </p>
        <p style="margin: 28px 0;">
            <a th:href="${shopUrl}"
               style="background-color: #007bff; color: #ffffff; padding: 12px 24px; text-decoration: none; border-radius: 24px; display: inline-block;">
                Visit <span th:text="${brandName}"></span>
            </a>
        </p>
        <hr style="border: none; border-top: 1px solid #eeeeee; margin: 28px 0 16px;"/>
        <p style="color: #888888; font-size: 12px; line-height: 1.5;">
            Didn't sign up, or changed your mind?
            <a th:href="${unsubscribeUrl}" style="color: #888888;">Unsubscribe</a>
        </p>
    </div>
</div>
</body>
</html>
