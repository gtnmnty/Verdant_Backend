<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm your new email address</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f4;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="560" cellpadding="0" cellspacing="0"
                   style="max-width:560px;width:100%;background-color:#ffffff;border-radius:8px;padding:32px;">
                <tr>
                    <td style="color:#222222;font-size:20px;font-weight:bold;padding-bottom:16px;">
                        Confirm your new email address
                    </td>
                </tr>
                <tr>
                    <td style="color:#444444;font-size:15px;line-height:1.6;padding-bottom:16px;">
                        This address was added to a Verdant Luxe account.
                        Enter this code to confirm that it belongs to you:
                    </td>
                </tr>
                <tr>
                    <td style="padding-bottom:16px;">
                        <div style="background-color:#f4f4f4;border-radius:6px;padding:12px 16px;color:#222222;font-size:24px;font-weight:bold;letter-spacing:4px;text-align:center;"
                             th:text="${verificationCode}">000000</div>
                    </td>
                </tr>
                <tr>
                    <td style="color:#444444;font-size:15px;line-height:1.6;padding-bottom:16px;"
                        th:text="|This code expires in ${expiresInMinutes} minutes. Never share it with anyone, including our staff.|">
                        This code expires in 15 minutes. Never share it with anyone, including our staff.
                    </td>
                </tr>
                <tr>
                    <td style="color:#888888;font-size:12px;line-height:1.5;border-top:1px solid #eeeeee;padding-top:16px;">
                        If you did not expect this email, you can ignore it.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
