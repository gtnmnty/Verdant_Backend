<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0;">
<div style="background-color: #f5f5f5; padding: 20px;">
    <div style="max-width: 560px; margin: 0 auto; background: #ffffff; padding: 28px; border-radius: 8px;">
        <h2 th:text="${brandName}" style="margin-top: 0;"></h2>

        <p th:each="paragraph : ${paragraphs}" th:text="${paragraph}" style="line-height: 1.6;"></p>

        <p th:if="${ctaLabel != null and ctaUrl != null}" style="margin: 28px 0;">
            <a th:href="${ctaUrl}" th:text="${ctaLabel}"
               style="background-color: #007bff; color: #ffffff; padding: 12px 24px; text-decoration: none; border-radius: 24px; display: inline-block;"></a>
        </p>

        <hr style="border: none; border-top: 1px solid #eeeeee; margin: 28px 0 16px;"/>
        <p style="color: #888888; font-size: 12px; line-height: 1.5;">
            You are receiving this email because you subscribed to updates from
            <span th:text="${brandName}"></span>.
            <a th:href="${unsubscribeUrl}" style="color: #888888;">Unsubscribe</a>
        </p>
    </div>
</div>
</body>
</html>
