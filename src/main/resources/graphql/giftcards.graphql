enum GiftCardStatus {
    ACTIVE
    REDEEMED
    DEPLETED
    EXPIRED
    CANCELLED
}

enum GiftCardTransactionType {
    PURCHASE
    REDEMPTION
    ORDER_PAYMENT
    REFUND
    ADMIN_ADJUSTMENT
    EXPIRY
}

type GiftCard {
    id: ID!
    code: String!
    balance: BigDecimal!
    initialAmount: BigDecimal!
    status: GiftCardStatus!
    paymentStatus: PaymentStatus!
    recipientName: String
    recipientEmail: String
    note: String
    expiresAt: DateTime
    createdAt: DateTime!
}

type GiftCardTransaction {
    id: ID!
    type: GiftCardTransactionType!
    amount: BigDecimal!
    description: String!
    orderId: ID
    createdAt: DateTime!
}

type GiftCardPayment {
    giftCard: GiftCard!
    clientSecret: String!
}

input PurchaseGiftCardInput {
    amount: BigDecimal!
    recipientName: String
    recipientEmail: String!
    note: String
}

input AdminIssueGiftCardInput {
    amount: BigDecimal!
    recipientName: String
    recipientEmail: String
    note: String
    expiresAt: DateTime
}

extend type Query {
    myGiftCards: [GiftCard!]!
    mySentGiftCards: [GiftCard!]!
    myWalletBalance: BigDecimal!
    myGiftCardTransactions: [GiftCardTransaction!]!
}

extend type Mutation {
    purchaseGiftCard(input: PurchaseGiftCardInput!): GiftCardPayment!
    redeemGiftCard(code: String!): GiftCard!
    adminIssueGiftCard(input: AdminIssueGiftCardInput!): GiftCard!
}