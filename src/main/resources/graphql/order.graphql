extend type Query {
    myOrders(
        status: OrderClientFilter = ALL
        timeframe: OrderTimeframe = RECENT
        search: String
        sort: OrderClientSort = NEWEST
        page: Int = 1
        pageSize: Int = 10
    ): OrderPage!
    order(id: ID!): Order

    adminOrders(
        status: OrderStatus
        search: String
        sort: AdminOrderSort = DATE
        direction: OrderSortDirection = DESC
        page: Int = 1
        pageSize: Int = 10
    ): AdminOrderPage!

    adminOrder(id: ID!): AdminOrder

    calculateShippingFee(deliveryOptions: [DeliveryOption!]!): BigDecimal!
}

extend type Mutation {
    adminCreateOrder(input: AdminCreateOrderInput!): AdminOrder!
    adminUpdateOrder(id: ID!, input: AdminUpdateOrderInput!): AdminOrder!
    # Card checkout creates no order: it returns a checkout session for the Stripe form, and the order is created
    # once Stripe confirms the payment. Only when the gift-card wallet covers everything is an order returned.
    placeOrder(input: PlaceOrderInput!): PlaceOrderResult!
    # Call after Stripe confirms the card; verifies the payment with Stripe and returns the order.
    finalizeCheckout(paymentIntentId: String!): Order!
    # Staff paying by card or bank for a customer (paymentMethod "card" or "bank"). Cash goes through adminCreateOrder.
    adminStartOrderPayment(input: AdminCreateOrderInput!): CheckoutSession!
    # Owner only, while the order is PLACED or PROCESSING and paid. The card is refunded automatically.
    cancelMyOrder(id: ID!, reason: OrderCancelReason!, note: String): Order!
    adminDeleteOrders(ids: [ID!]!): [Order!]!
}

input AdminOrderItemInput {
    productId: ID!
    quantity: Int!
    deliveryOption: DeliveryOption!
}

type CheckoutSession {
    draftId: ID!
    paymentIntentId: String!
    clientSecret: String!
    amount: BigDecimal!
    currency: String!
}

# Exactly one is set: order (paid from the wallet, created now) or checkout (a card payment is still needed).
type PlaceOrderResult {
    order: Order
    checkout: CheckoutSession
}

enum OrderCancelReason {
    CHANGED_MIND
    WRONG_ADDRESS_OR_ITEM
    FOUND_BETTER_PRICE
    DELIVERY_TOO_SLOW
    OTHER
}

input PlaceOrderInput {
    cartItemIds: [ID!]!
    # Contact details for this order (all required); saved on the order, not on the customer's profile.
    fullName: String!
    phone: String!
    email: String!
    shippingAddress: AddressInput!
    paymentMethod: String!
    promoCode: String
    # M-21: pay as much as possible from the customer's redeemed gift card balance; Stripe charges the rest.
    # Was missing from the schema, so PlaceOrderInput.useWalletBalance was always null and the wallet unusable.
    useWalletBalance: Boolean = false
}

input AdminCreateOrderInput {
    userId: ID
    fullName: String
    phone: String
    email: String
    shippingAddress: AddressInput!
    # "card", "bank" or "cash". Card and bank pay through adminStartOrderPayment; cash is placed directly.
    paymentMethod: String!
    items: [AdminOrderItemInput!]!
    promoCode: String
}

input AdminUpdateOrderInput {
    userId: ID @deprecated(reason: "Ignored: an order can't be moved to another customer.")
    # Contact details for this order only; the customer's saved profile is not changed.
    fullName: String
    phone: String
    email: String
    shippingAddress: AddressInput
    paymentMethod: String
    orderStatus: OrderStatus
    paymentStatus: PaymentStatus
    items: [AdminOrderItemInput!]
}

enum OrderStatus {
    PLACED
    PROCESSING
    IN_TRANSIT
    DELIVERED
    CANCELLED
}

# Must list every value of the Java PaymentStatus enum (H-6): every new order starts PENDING,
# and serializing a value missing here fails the whole non-null field. EnumSchemaParityTest checks it.
enum PaymentStatus {
    PENDING
    REQUIRES_ACTION
    PROCESSED
    PAID
    FAILED
    # M-14: part of a paid charge was refunded.
    PARTIALLY_REFUNDED
    REFUNDED
    CANCELLED
}

enum OrderClientFilter {
    ALL
    PROCESSING
    IN_TRANSIT
    DELIVERED
    CANCELLED
}

enum OrderTimeframe {
    RECENT
    ARCHIVED
}

enum OrderClientSort {
    NEWEST
    OLDEST
    HIGHEST_TOTAL
}

enum AdminOrderSort {
    DATE
    TOTAL
    STATUS
}

enum OrderSortDirection {
    ASC
    DESC
}

type OrderPage {
    items: [Order!]!
    page: Int!
    pageSize: Int!
    totalItems: Int!
    totalPages: Int!
}

type AdminOrderPage {
    items: [AdminOrder!]!
    page: Int!
    pageSize: Int!
    totalItems: Int!
    totalPages: Int!
}

type Order {
    id: ID!
    orderCode: String!
    user: User!
    orderStatus: OrderStatus!
    paymentStatus: PaymentStatus!
    paymentMethod: String!
    address: Address!
    subtotal: BigDecimal!
    deliveryFee: BigDecimal!
    total: BigDecimal!
    items: [OrderItem!]!
    createdAt: DateTime!
    updatedAt: DateTime!
    walletAmountApplied: BigDecimal
    promoDiscountAmount: BigDecimal
    trackingNumber: String
    contactName: String
    contactPhone: String
    contactEmail: String
    # When the payment settled; the delivery estimate counts from here. Null while unpaid.
    paidAt: DateTime
    cancelReason: String
    cancelledAt: DateTime
    # Server-computed: the viewer owns the order, it is paid, and it hasn't shipped.
    cancellable: Boolean!
}

# Slim product reference for order lines (H-12). Deliberately not the full Product type: the order
# line is backed by OrderItemProductDto, not a Product entity, so Product's own field resolvers
# (images, isFavorited...) could not bind to it. Only the primary image is exposed.
type OrderItemProduct {
    id: ID!
    name: String!
    catalog: ItemCatalog!
    price: BigDecimal!
    primaryImage: MediaImageDto
}

type OrderItem {
    id: ID!
    product: OrderItemProduct
    productName: String!
    productImage: String
    quantity: Int!
    unitPrice: BigDecimal!
    subtotal: BigDecimal!
    deliveryOption: DeliveryOption!
    quantityLabel: String!
    # Expected arrival window for this line's delivery option, counted from when the order was paid
    # (shipping.days.* in application.properties).
    estimatedDeliveryMin: DateTime
    estimatedDeliveryMax: DateTime
}

type AdminOrder {
    id: ID!
    orderCode: String!
    user: User!
    orderStatus: OrderStatus!
    paymentStatus: PaymentStatus!
    paymentMethod: String!
    address: Address!
    subtotal: BigDecimal!
    deliveryFee: BigDecimal!
    total: BigDecimal!
    itemCount: Int!
    items: [AdminOrderItem!]!
    activity: [OrderActivity!]!
    createdAt: DateTime!
    updatedAt: DateTime!
    walletAmountApplied: BigDecimal
    promoDiscountAmount: BigDecimal
    trackingNumber: String
    contactName: String
    contactPhone: String
    contactEmail: String
    paidAt: DateTime
    cancelReason: String
    cancelledAt: DateTime
}

type AdminOrderItem {
    id: ID!
    product: OrderItemProduct
    productName: String!
    productImage: String
    quantity: Int!
    unitPrice: BigDecimal!
    subtotal: BigDecimal!
    deliveryOption: DeliveryOption!
    quantityLabel: String!
}

type OrderActivity {
    label: String!
    timestamp: DateTime!
}
