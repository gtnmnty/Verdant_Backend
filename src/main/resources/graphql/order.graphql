extend type Query {
    myOrders(
        status: OrderClientFilter = ALL
        timeframe: OrderTimeframe = RECENT
        search: String
        sort: OrderClientSort = NEWEST
        page: Int = 1
        pageSize: Int = 10
    ): OrderPage!
    order(id: ID!): Order

    adminOrders(
        status: OrderStatus
        search: String
        sort: AdminOrderSort = DATE
        direction: OrderSortDirection = DESC
        page: Int = 1
        pageSize: Int = 10
    ): AdminOrderPage!

    adminOrder(id: ID!): AdminOrderDto
}

extend type Mutation {
    adminCreateOrder(input: AdminCreateOrderInput!): AdminOrderDto!
    adminUpdateOrder(id: ID!, input: AdminUpdateOrderInput!): AdminOrderDto!
    placeOrder(input: PlaceOrderInput!): Order!
    adminDeleteOrders(ids: [ID!]!): [Order!]!
}

input AdminOrderItemInput {
    productId: ID!
    quantity: Int!
    deliveryOption: DeliveryOption!
}

input PlaceOrderInput {
    cartItemIds: [ID!]!
    shippingAddress: AddressInput!
    paymentMethod: String!
}

input AdminCreateOrderInput {
    userId: ID
    fullName: String
    phone: String
    email: String
    shippingAddress: AddressInput!
    paymentMethod: String!
    items: [AdminOrderItemInput!]!
}

input AdminUpdateOrderInput {
    userId: ID
    fullName: String
    phone: String
    email: String
    shippingAddress: AddressInput
    paymentMethod: String
    orderStatus: OrderStatus
    paymentStatus: PaymentStatus
    items: [AdminOrderItemInput!]
}

enum OrderStatus {
    PLACED
    PROCESSING
    IN_TRANSIT
    DELIVERED
    CANCELLED
}

enum PaymentStatus {
    PROCESSED
    PAID
    FAILED
    REFUNDED
    CANCELLED
}

enum OrderClientFilter {
    ALL
    PROCESSING
    IN_TRANSIT
    DELIVERED
    CANCELLED
}

enum OrderTimeframe {
    RECENT
    ARCHIVED
}

enum OrderClientSort {
    NEWEST
    OLDEST
    HIGHEST_TOTAL
}

enum AdminOrderSort {
    DATE
    TOTAL
    STATUS
}

enum OrderSortDirection {
    ASC
    DESC
}

type OrderPage {
    items: [Order!]!
    page: Int!
    pageSize: Int!
    totalItems: Int!
    totalPages: Int!
}

type AdminOrderPage {
    items: [AdminOrderDto!]!
    page: Int!
    pageSize: Int!
    totalItems: Int!
    totalPages: Int!
}

type Order {
    id: ID!
    orderCode: String!
    user: User!
    orderStatus: OrderStatus!
    paymentStatus: PaymentStatus!
    paymentMethod: String!
    address: Address!
    subtotal: BigDecimal!
    deliveryFee: BigDecimal!
    total: BigDecimal!
    items: [OrderItemDto!]!
    createdAt: DateTime!
    updatedAt: DateTime!
}

type OrderItemDto {
    id: ID!
    product: Product
    productName: String!
    productImage: String
    quantity: Int!
    unitPrice: BigDecimal!
    subtotal: BigDecimal!
    deliveryOption: DeliveryOption!
    quantityLabel: String!
}

type AdminOrderDto {
    id: ID!
    orderCode: String!
    user: User!
    orderStatus: OrderStatus!
    paymentStatus: PaymentStatus!
    paymentMethod: String!
    address: Address!
    subtotal: BigDecimal!
    deliveryFee: BigDecimal!
    total: BigDecimal!
    itemCount: Int!
    items: [AdminOrderItemDto!]!
    activity: [OrderActivityDto!]!
    createdAt: DateTime!
    updatedAt: DateTime!
}

type AdminOrderItemDto {
    id: ID!
    product: Product
    productName: String!
    productImage: String
    quantity: Int!
    unitPrice: BigDecimal!
    subtotal: BigDecimal!
    deliveryOption: DeliveryOption!
    itemLine: String!
}

type OrderActivityDto {
    label: String!
    timestamp: DateTime!
}
