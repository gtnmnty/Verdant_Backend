scalar Upload

extend type Mutation {
    addImage(
        entityType: ItemType!
        entityId: ID!
        image: [Upload!]!
        isPrimary: Boolean
    ): [MediaImageDto!]!
    removeImage(itemType: ItemType!, imageId: ID!, serviceId: ID): Boolean!
    setImagePrimary(itemType: ItemType!, imageId: ID!, serviceId: ID): MediaImageDto!
}

type MediaImageDto {
    id: ID!
    url: String!
    publicId: String!
    isPrimary: Boolean!
    sortOrder: Int!
}