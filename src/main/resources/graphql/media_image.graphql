scalar Upload

extend type Mutation {
    addImage(
        entityType: ItemType!
        entityId: ID!
        image: [Upload!]!
        isPrimary: Boolean
    ): [MediaImageDto!]!
    removeImage(entityType: ItemType!, imageId: ID!, entityId: ID!): Boolean!
    setImagePrimary(entityType: ItemType!, imageId: ID!, entityId: ID!): MediaImageDto!
}

type MediaImageDto {
    id: ID!
    url: String!
    publicId: String!
    isPrimary: Boolean!
    sortOrder: Int!
}