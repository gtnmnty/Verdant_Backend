extend type Query {
    auditLogForEntity(
        entityType: AuditEntityType!
        entityId: ID!
        page: Int = 0
        size: Int = 30
    ): AuditLogPage!
    auditDashboardFeed(
        page: Int = 0
        size: Int = 5
    ): AuditLogPage!
}

enum AuditEntityType {
    DASHBOARD
    ORDER
    STYLIST
    ACCOUNT
}

enum AuditActionType {
    CREATED
    BOOKED
    RESTOCKED
    FAVORITE
    UPDATED
    CANCELLED
    DELETED
    SECURITY
    ADMINISTRATIVE
    STOCK_ADJUSTED
    PAYMENT_INITIATED
    PAYMENT_SUCCEEDED
    PAYMENT_FAILED
    PAYMENT_REFUNDED
    UNFAVORITED
    RESCHEDULED
    APPROVED
    REJECTED
    COMPLETED
    REVIEWED
    IMAGE_UPDATED
    STATUS_CHANGED
    ASSIGNED
    BULK_CANCELLED
    BULK_DELETED
}

type AuditLogEntry {
    id: ID!
    actionType: AuditActionType!
    title: String!
    detail: String
    actorLabel: String
    selfService: Boolean!
    createdAt: DateTime!
}

type AuditLogPage {
    content: [AuditLogEntry!]!
    totalElements: Int!
    hasNext: Boolean!
}
