extend type Query {
    adminStylists(
        status: StylistAccountStatus
        branchId: ID
        search: String
        serviceIds: [ID!]
        sort: StylistSort
        page: Int = 1
        pageSize: Int = 10
    ): AdminStylistsPage!
    adminStylist(id: ID!): AdminStylistsDto
}

extend type Mutation {
    createStylist(input: CreateStylistInput!): Stylist!
    updateStylist(id: ID!, input: UpdateStylistInput!): Stylist!
    deleteStylist(id: ID!): AdminStylistsDto!
    deleteStylists(ids: [ID!]!): [AdminStylistsDto!]!
    updateStylistStatus(id: ID!, status: StylistAccountStatus!): Stylist!
    assignStylistToServices(stylistId: ID!, serviceIds: [ID!]!): Stylist!
}

type StylistConnection {
    content: [Stylist!]!
    totalElements: Int!
    totalPages: Int!
    pageNumber: Int!
    pageSize: Int!
}

type AdminStylistsPage{
    items: [AdminStylistsDto!]!
    page: Int!
    pageSize: Int!
    totalItems: Int!
    totalPages: Int!
}

enum StylistSort{
    NEWEST
    OLDEST
    A_TO_Z
    Z_TO_A
}

enum StylistAccountStatus {
    ACTIVE
    INACTIVE
    SUSPENDED
    PENDING
}

# Customer-facing view of a stylist (audit C-2). /graphql is public, so anything a
# customer or anonymous visitor can reach uses this type: no email, phone, status,
# working hours, or service list (which would also reveal unpublished services).
# The full Stylist type below is only returned by staff-guarded queries and mutations.
type PublicStylist {
    id: ID!
    name: String!
    bio: String
    avatarUrl: String
    branch: Branch
}

# Staff-only. Never reference this from a type that public queries can return.
type Stylist {
    id: ID!
    name: String!
    email: String
    phone: String
    status: StylistAccountStatus!
    bio: String
    avatarUrl: String
    branch: Branch
    services: [SalonService!]!
    workingHours: [OperatingHours!]!
    createdAt: DateTime!
    updatedAt: DateTime!
}

type AdminStylistsDto {
    id: ID!
    name: String!
    email: String!
    phone: String
    status: StylistAccountStatus!
    bio: String
    avatarUrl: String
    createdAt: DateTime!
    updatedAt: DateTime!
    branch: Branch
    services: [SalonService!]!
    workingHours: [OperatingHours!]!
}

input CreateStylistInput {
    name: String!
    email: String
    phone: String
    bio: String
    avatarUrl: String
    branchId: ID!
    serviceIds: [ID!]
    workingHours: [OperatingHoursInput!]
}

input UpdateStylistInput {
    name: String
    email: String
    phone: String
    bio: String
    avatarUrl: String
    branchId: ID
    workingHours: [OperatingHoursInput!]
}