extend type Query {
    me: User!
}

extend type Mutation {
    updateProfile(input: UpdateProfileInput!): User!
    # Second step of a self-service email change: the code mailed to pendingEmail.
    confirmEmailChange(code: String!): User!
}

type User {
    id: ID!
    fullName: String!
    email: String!
    # Requested new email still awaiting its confirmation code; null when none.
    pendingEmail: String
    phone: String
    shippingAddress: Address
    avatarUrl: String
    savedPaymentMethod: PaymentMethodSummary
    createdAt: DateTime!
    cart: Cart
}

type PaymentMethodSummary {
    brand: String!
    last4: String!
}

input UpdateProfileInput {
    fullName: String
    phone: String
    # A different email starts a pending change (code sent to the new address).
    email: String
    # Required whenever email differs from the current one.
    currentPassword: String
    shippingAddress: AddressInput
}
