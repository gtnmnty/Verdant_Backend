spring.application.name=salon-ecomm
# M-6: no default profile. It used to be "local", so a deployment that forgot SPRING_PROFILES_ACTIVE
# silently ran with GraphiQL on, DEBUG web logging and a non-Secure refresh cookie.
# SalonEcommApplication now refuses to start without a profile. Set SPRING_PROFILES_ACTIVE
# (or -Dspring.profiles.active) to local, dev or docker.

spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=SalonEcommPool
spring.graphql.graphiql.enabled=false
# M-8: introspection off by default, so the whole schema (admin mutations included) can't be listed
# by anyone. application-local.properties turns it back on for GraphiQL and IDE tooling.
spring.graphql.schema.introspection.enabled=false
# M-6: the refresh cookie is Secure unless a profile explicitly says otherwise (only local does).
app.cookie.secure=true
# Lazy associations (order -> user, order item / cart item -> product, ...) load in batches of up
# to 50 ids instead of one query per row when a page of entities is mapped to DTOs.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Set active profile via env var SPRING_PROFILES_ACTIVE or -Dspring.profiles.active
# e.g. local (for local dev), docker (for container), dev/prod etc.

security.jwt.secret-key=${JWT_SECRET}
security.jwt.expiration-time=${JWT_EXPIRATION}
security.jwt.refresh-expiration-time=604800000

spring.data.redis.repositories.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Scheduled jobs (H-8, see config/SchedulingConfig). One thread per job, so a slow Stripe or
# Cloudinary call in one job can't hold up the others. Raise it when you add a job.
spring.task.scheduling.pool.size=3
spring.task.scheduling.thread-name-prefix=scheduled-
# Set to false to turn every @Scheduled job off (tests, one-off tooling).
app.scheduling.enabled=true

spring.flyway.baseline-on-migrate=true
# Production and existing copies already have the V1 baseline schema, so baseline them at 1 (V1 is skipped);
# an empty database has nothing to baseline and runs V1 onwards.
spring.flyway.baseline-version=1

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

#Stripe
stripe.api-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

#Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SUPPORT_EMAIL}
spring.mail.password=${APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Delivery fee per order, in the store currency (stripe.currency). An order pays the highest fee among its items' options.
shipping.fee.standard=0.00
shipping.fee.express=5.00
shipping.fee.same-day=10.00

spring.config.import=optional:file:.env[.properties]

# local
app.cors.allowed-origins=${FRONTEND_URL}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

#debug=true
spring.devtools.restart.enabled=false
spring.graphql.schema.file-extensions=.graphqls,.gqls,.graphql

logging.level.root=INFO
logging.level.org.springframework.graphql=WARN
logging.level.graphql=WARN